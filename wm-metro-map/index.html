<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>West Midlands Metro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1a2e; font-family: Arial, sans-serif; }
    #map { width: 100%; height: 100%; }

    /* Overlay */
    #overlay {
      position: absolute; top: 16px; left: 16px; z-index: 1000;
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 16px 20px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      min-width: 200px; pointer-events: none;
    }
    #overlay h1 { font-size: 17px; font-weight: bold; margin-bottom: 3px; }
    #overlay .sub { font-size: 11px; color: #888; margin-bottom: 12px; }
    #overlay .stat { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 5px; }
    #overlay .dot { width: 10px; height: 10px; border-radius: 50%; background: #00a0dc; }
    #overlay .updated { font-size: 11px; color: #888; }
    #overlay .sim-badge {
      margin-top: 8px; padding: 4px 8px;
      background: rgba(255,184,0,0.15); border: 1px solid rgba(255,184,0,0.4);
      border-radius: 4px; font-size: 10px; color: #ffb800;
      font-weight: bold; letter-spacing: 1px; text-transform: uppercase;
    }

    /* Legend */
    #legend {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(0,0,0,0.75); color: #fff;
      padding: 8px 18px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; gap: 18px; align-items: center;
      font-size: 12px; pointer-events: none;
    }
    #legend .item { display: flex; align-items: center; gap: 6px; }
    .leg-route { width: 16px; height: 3px; background: #ffb800; border-radius: 2px; }
    .leg-stop { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
    .leg-tram { width: 12px; height: 12px; border-radius: 50%; background: #00a0dc; border: 2px solid #fff; }

    /* Leaflet overrides */
    .leaflet-container { background: #1a1a2e; }
    .tram-marker {
      width: 16px; height: 16px; border-radius: 50%;
      background: #00a0dc; border: 3px solid #fff;
      box-shadow: 0 0 8px rgba(0,160,220,0.6);
      transition: transform 0.1s;
    }
    .stop-marker {
      width: 10px; height: 10px; border-radius: 50%;
      background: #fff; border: 2px solid #ccc;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="overlay">
  <h1>West Midlands Metro</h1>
  <div class="sub" id="mode-label">Connecting...</div>
  <div class="stat">
    <div class="dot"></div>
    <span><span id="tram-count">6</span> trams running</span>
  </div>
  <div class="updated" id="clock">--:--:--</div>
  <div class="sim-badge" id="sim-badge" style="display:none">Simulated</div>
</div>

<div id="legend">
  <div class="item"><div class="leg-route"></div><span>Route</span></div>
  <div class="item"><div class="leg-stop"></div><span>Stop</span></div>
  <div class="item"><div class="leg-tram"></div><span>Tram</span></div>
</div>

<script>
// ─── Stop data from TfWM API (real coordinates) ──────────────────────────────
// Main line: Edgbaston Village → Wolverhampton Station
const STOPS = [
  { name: "Edgbaston Village",            lat: 52.47204, lon: -1.92355 },
  { name: "Five Ways",                    lat: 52.47474, lon: -1.91524 },
  { name: "Brindleyplace",               lat: 52.47672, lon: -1.91225 },
  { name: "Centenary Square",            lat: 52.47878, lon: -1.90824 },
  { name: "Town Hall",                   lat: 52.47926, lon: -1.90333 },
  { name: "Grand Central",              lat: 52.47858, lon: -1.89912 },
  { name: "Corporation Street",          lat: 52.47998, lon: -1.89705 },
  { name: "Bull Street",                 lat: 52.48190, lon: -1.89630 },
  { name: "St Chad's",                   lat: 52.48475, lon: -1.90058 },
  { name: "St Paul's",                   lat: 52.48722, lon: -1.90466 },
  { name: "Jewellery Quarter",           lat: 52.48989, lon: -1.91424 },
  { name: "Soho Benson Road",            lat: 52.49705, lon: -1.93090 },
  { name: "Winson Green",               lat: 52.49891, lon: -1.93920 },
  { name: "Handsworth Booth Street",     lat: 52.50210, lon: -1.95235 },
  { name: "The Hawthorns",              lat: 52.50582, lon: -1.96514 },
  { name: "Kenrick Park",               lat: 52.50870, lon: -1.98256 },
  { name: "Trinity Way",                lat: 52.51191, lon: -1.98830 },
  { name: "West Bromwich Central",       lat: 52.51656, lon: -1.99459 },
  { name: "Lodge Road",                  lat: 52.51868, lon: -1.99999 },
  { name: "Dartmouth Street",            lat: 52.52048, lon: -2.00440 },
  { name: "Dudley Street Guns Village",  lat: 52.52514, lon: -2.00846 },
  { name: "Black Lake",                  lat: 52.53102, lon: -2.01123 },
  { name: "Wednesbury Central",          lat: 52.54898, lon: -2.02557 },
  { name: "Wednesbury Parkway",          lat: 52.54974, lon: -2.03191 },
  { name: "Bradley Lane",               lat: 52.55609, lon: -2.05787 },
  { name: "Loxdale",                    lat: 52.56011, lon: -2.06583 },
  { name: "Bilston Central",            lat: 52.56528, lon: -2.07461 },
  { name: "The Crescent",               lat: 52.56796, lon: -2.08095 },
  { name: "Priestfield",               lat: 52.57193, lon: -2.09786 },
  { name: "The Royal",                  lat: 52.58113, lon: -2.11723 },
  { name: "Pipers Row",                 lat: 52.58525, lon: -2.12274 },
  { name: "Wolverhampton St George's",  lat: 52.58405, lon: -2.12449 },
  { name: "Wolverhampton Station",      lat: 52.58725, lon: -2.11956 },
];

// Eastside extension branch (from Bull Street)
const EASTSIDE_STOPS = [
  { name: "Bull Street",                 lat: 52.48190, lon: -1.89630 },
  { name: "Albert Street",              lat: 52.48043, lon: -1.89249 },
  { name: "Millennium Point",           lat: 52.48087, lon: -1.89005 },
];

// ─── Pre-compute cumulative distances along route ─────────────────────────────
function haversine(a, b) {
  const R = 6371000;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

const segDists = [];   // distance of each segment
let cumDist = [0];    // cumulative distance at each stop
for (let i = 1; i < STOPS.length; i++) {
  const d = haversine(STOPS[i-1], STOPS[i]);
  segDists.push(d);
  cumDist.push(cumDist[i-1] + d);
}
const totalDist = cumDist[cumDist.length - 1];

// Interpolate lat/lon at distance `d` along route
function posAtDist(d) {
  d = Math.max(0, Math.min(totalDist, d));
  for (let i = 1; i < STOPS.length; i++) {
    if (cumDist[i] >= d) {
      const t = (d - cumDist[i-1]) / segDists[i-1];
      return {
        lat: STOPS[i-1].lat + t * (STOPS[i].lat - STOPS[i-1].lat),
        lon: STOPS[i-1].lon + t * (STOPS[i].lon - STOPS[i-1].lon),
      };
    }
  }
  return { lat: STOPS[STOPS.length-1].lat, lon: STOPS[STOPS.length-1].lon };
}

// Nearest stop name at distance d
function nearestStop(d) {
  let closest = 0, best = Infinity;
  for (let i = 0; i < cumDist.length; i++) {
    const diff = Math.abs(cumDist[i] - d);
    if (diff < best) { best = diff; closest = i; }
  }
  return STOPS[closest].name;
}

// ─── Map initialisation ───────────────────────────────────────────────────────
const MAPTILER_KEY = 'FXaZMCVlJ0FwgtPRY0Hp';

const map = L.map('map', {
  center: [52.53, -2.01],
  zoom: 11,
  zoomControl: true,
  attributionControl: true,
});

L.tileLayer(
  `https://api.maptiler.com/maps/dataviz-dark/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`,
  {
    tileSize: 256,
    attribution: '&copy; <a href="https://www.maptiler.com/">MapTiler</a> &copy; OpenStreetMap contributors',
    maxZoom: 18,
  }
).addTo(map);

// ─── Draw route polylines ─────────────────────────────────────────────────────
const routeStyle = { color: '#ffb800', weight: 4, opacity: 0.9, lineJoin: 'round', lineCap: 'round' };
L.polyline(STOPS.map(s => [s.lat, s.lon]), routeStyle).addTo(map);
L.polyline(EASTSIDE_STOPS.map(s => [s.lat, s.lon]), routeStyle).addTo(map);

// ─── Draw stop markers ────────────────────────────────────────────────────────
const allStops = [...STOPS, ...EASTSIDE_STOPS.slice(1)]; // skip Bull Street duplicate
allStops.forEach(stop => {
  const icon = L.divIcon({
    className: '',
    html: '<div class="stop-marker"></div>',
    iconSize: [10, 10],
    iconAnchor: [5, 5],
  });
  L.marker([stop.lat, stop.lon], { icon })
    .bindTooltip(stop.name, { direction: 'top', offset: [0, -8], opacity: 0.9 })
    .addTo(map);
});

// ─── Stop name lookup ─────────────────────────────────────────────────────────
const stopNameToIndex = {};
STOPS.forEach((s, i) => { stopNameToIndex[s.name] = i; });

function cleanStationName(name) {
  return name.replace(/\s*\(West Midlands Metro\)\s*$/, '').replace(/\s+Outer Circle$/, '');
}

// ─── Live data fetching ───────────────────────────────────────────────────────
let isLive = false;
let liveMarkers = [];

async function fetchLiveData() {
  const res = await fetch('/api/arrivals');
  const data = await res.json();
  const predictions = data?.ArrayOfPrediction?.Prediction;
  if (!predictions || !Array.isArray(predictions)) return null;

  // Group by Id (each Id = one tram journey)
  const groups = {};
  for (const p of predictions) {
    if (!groups[p.Id]) groups[p.Id] = [];
    groups[p.Id].push(p);
  }

  const now = Date.now();
  const liveTrams = [];

  for (const [id, preds] of Object.entries(groups)) {
    preds.sort((a, b) => parseInt(a.StopSequence) - parseInt(b.StopSequence));

    // Find the next stop with a known arrival time
    let nextPred = null;
    for (const p of preds) {
      const arr = p.ExpectedArrival || p.ScheduledArrival;
      if (arr && new Date(arr).getTime() > now - 60000) { nextPred = p; break; }
    }
    if (!nextPred) nextPred = preds[0]; // fallback to first

    const stopName = cleanStationName(nextPred.StationName);
    const stopIdx = stopNameToIndex[stopName];
    if (stopIdx === undefined) continue;

    // Previous stop depends on direction
    const isOutbound = nextPred.Direction === 'outbound';
    const prevIdx = isOutbound
      ? Math.max(0, stopIdx - 1)
      : Math.min(STOPS.length - 1, stopIdx + 1);

    // Calculate how far along the segment the tram is
    let fraction = 0.5;
    const arrStr = nextPred.ExpectedArrival || nextPred.ScheduledArrival;
    if (arrStr && preds.length >= 2) {
      const timeToNext = (new Date(arrStr).getTime() - now) / 1000;
      const arr2 = preds[1].ExpectedArrival || preds[1].ScheduledArrival;
      if (arr2) {
        const segTime = Math.abs(new Date(arr2).getTime() - new Date(arrStr).getTime()) / 1000;
        if (segTime > 0) fraction = Math.max(0, Math.min(1, 1 - timeToNext / segTime));
      }
    }

    const from = STOPS[prevIdx];
    const to = STOPS[stopIdx];
    liveTrams.push({
      lat: from.lat + fraction * (to.lat - from.lat),
      lon: from.lon + fraction * (to.lon - from.lon),
      towards: nextPred.Towards || nextPred.Direction,
      nextStop: stopName,
    });
  }

  return liveTrams.length > 0 ? liveTrams : null;
}

// ─── Tram state: smooth interpolation for both live and sim ──────────────────
const tramIcon = L.divIcon({
  className: '',
  html: '<div class="tram-marker"></div>',
  iconSize: [16, 16],
  iconAnchor: [8, 8],
});

// Each tram has: current display pos, target pos, marker, metadata
let tramState = []; // [{ lat, lon, targetLat, targetLon, towards, nextStop, marker }]

function ensureMarkers(count) {
  // Add markers if we need more
  while (tramState.length < count) {
    const m = L.marker([0, 0], { icon: tramIcon, zIndexOffset: 1000 })
      .bindTooltip('', { direction: 'top', offset: [0, -12], opacity: 0.9 })
      .addTo(map);
    tramState.push({ lat: 0, lon: 0, targetLat: 0, targetLon: 0, towards: '', nextStop: '', marker: m });
  }
  // Remove excess markers
  while (tramState.length > count) {
    const t = tramState.pop();
    map.removeLayer(t.marker);
  }
}

function setTargets(tramData) {
  ensureMarkers(tramData.length);
  tramData.forEach((d, i) => {
    const t = tramState[i];
    // If marker was at 0,0 (first placement), snap immediately
    if (t.lat === 0 && t.lon === 0) { t.lat = d.lat; t.lon = d.lon; }
    t.targetLat = d.lat;
    t.targetLon = d.lon;
    t.towards = d.towards;
    t.nextStop = d.nextStop;
  });
  document.getElementById('tram-count').textContent = tramData.length;
}

// Smoothly move displayed positions toward targets each frame
function lerpMarkers(speed) {
  tramState.forEach(t => {
    t.lat += (t.targetLat - t.lat) * speed;
    t.lon += (t.targetLon - t.lon) * speed;
    t.marker.setLatLng([t.lat, t.lon]);
    t.marker.setTooltipContent(`→ ${t.nextStop}`);
  });
  document.getElementById('clock').textContent = 'Updated: ' + new Date().toLocaleTimeString();
}

// ─── Simulation fallback ──────────────────────────────────────────────────────
const TRAM_SPEED = 15;
const NUM_SIM_TRAMS = 6;
const simTrams = Array.from({ length: NUM_SIM_TRAMS }, (_, i) => ({
  dist: (totalDist / NUM_SIM_TRAMS) * i,
  dir: i % 2 === 0 ? 1 : -1,
}));

function stepSimulation(dt) {
  const data = simTrams.map(tram => {
    tram.dist += tram.dir * TRAM_SPEED * dt;
    if (tram.dist >= totalDist) { tram.dist = totalDist; tram.dir = -1; }
    if (tram.dist <= 0) { tram.dist = 0; tram.dir = 1; }
    const pos = posAtDist(tram.dist);
    return {
      lat: pos.lat, lon: pos.lon,
      towards: tram.dir > 0 ? 'Wolverhampton' : 'Edgbaston Village',
      nextStop: nearestStop(tram.dist + tram.dir * 300),
    };
  });
  setTargets(data);
}

// ─── Live data fetching ──────────────────────────────────────────────────────
let isLive = false;

async function pollLive() {
  try {
    const data = await fetchLiveData();
    if (data) {
      if (!isLive) {
        isLive = true;
        document.getElementById('mode-label').textContent = 'Live Tracking';
        document.getElementById('sim-badge').style.display = 'none';
      }
      setTargets(data);
    } else {
      throw new Error('No trams in response');
    }
  } catch (e) {
    if (isLive) {
      isLive = false;
      document.getElementById('mode-label').textContent = 'Simulation Mode';
      document.getElementById('sim-badge').style.display = '';
    }
  }
}

// ─── Main animation loop (60fps) ─────────────────────────────────────────────
let lastFrameTime = null;

function animate(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
  lastFrameTime = timestamp;

  if (isLive) {
    // Smooth lerp toward API targets — 0.08 per frame ≈ reaches target in ~0.5s
    lerpMarkers(0.08);
  } else {
    // Simulation: advance positions then snap targets (sim is already smooth)
    stepSimulation(dt);
    lerpMarkers(1.0); // instant for sim since targets update every frame
  }

  requestAnimationFrame(animate);
}

// Start: try live, poll every 15s, animate at 60fps always
pollLive();
setInterval(pollLive, 15000);
requestAnimationFrame(animate);
</script>
</body>
</html>
